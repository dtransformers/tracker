name: Backend Enforcement CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  enforce-backend-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: go mod tidy

      - name: Fix script permissions
        run: chmod +x ./scripts/hooks/*.sh

      - name: Validate structure
        run: bash ./scripts/hooks/validate_structure.sh
      
      - name: Validate scope (README alignment)
        run: bash ./scripts/hooks/validate_scope.sh

      - name: Validate HISTORY.md updates
        run: bash ./scripts/hooks/validate_history.sh

      - name: Validate documentation
        run: bash ./scripts/hooks/validate_docs.sh

      - name: Lint
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v ./...

      - name: Verify Docker Build
        run: docker build -t tracking-api:test .