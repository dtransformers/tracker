# Top-level defaults for v3
all: false
force-file-write: true
log-level: info
recursive: false

packages:
  tracking/internal/modules/sites/v1:
    config:
      all: true
      dir: "internal/modules/sites/v1/mocks"
      filename: "mock_{{.InterfaceName}}.go"
      pkgname: "mocks"

  tracking/internal/modules/visitors/v1:
    config:
      all: true
      dir: "internal/modules/visitors/v1/mocks"
      filename: "mock_{{.InterfaceName}}.go"
      pkgname: "mocks"

  tracking/internal/modules/devices/v1:
    config:
      all: true
      dir: "internal/modules/devices/v1/mocks"
      filename: "mock_{{.InterfaceName}}.go"
      pkgname: "mocks"

  tracking/internal/modules/visitor_sessions/v1:
    config:
      all: true
      dir: "internal/modules/visitor_sessions/v1/mocks"
      filename: "mock_{{.InterfaceName}}.go"
      pkgname: "mocks"

  tracking/internal/modules/consents/v1:
    config:
      all: true
      dir: "internal/modules/consents/v1/mocks"
      filename: "mock_{{.InterfaceName}}.go"
      pkgname: "mocks"
