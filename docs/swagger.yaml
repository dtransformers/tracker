host: localhost:3000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a tracking service API.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Tracking API
  version: "1.0"
paths:
  /api/v1/consents:
    post:
      consumes:
      - application/json
      description: Updates the consent status for a specific site and visitor
      parameters:
      - description: Site API Key
        in: header
        name: X-Api-Key
        required: true
        type: string
      - description: Client Fingerprint
        in: header
        name: X-Fingerprint
        required: true
        type: string
      - description: Request Nonce
        in: header
        name: X-Nonce
        required: true
        type: string
      - description: Consent Request Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateConsentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.UpdateConsentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_consents_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_consents_v1.ErrorResponse'
      summary: Update visitor consent
      tags:
      - Consents
  /api/v1/events/custom:
    post:
      consumes:
      - application/json
      description: Records a custom event for a visitor
      parameters:
      - description: Site API Key
        in: header
        name: X-Api-Key
        required: true
        type: string
      - description: Client Fingerprint
        in: header
        name: X-Fingerprint
        required: true
        type: string
      - description: Request Nonce
        in: header
        name: X-Nonce
        required: true
        type: string
      - description: Event Request Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_events_v1.CreateEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ent.VisitorEvent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_events_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_events_v1.ErrorResponse'
      summary: Create custom event
      tags:
      - Events
  /api/v1/events/pageviews:
    post:
      consumes:
      - application/json
      description: Records a page view for a visitor
      parameters:
      - description: Site API Key
        in: header
        name: X-Api-Key
        required: true
        type: string
      - description: Client Fingerprint
        in: header
        name: X-Fingerprint
        required: true
        type: string
      - description: Request Nonce
        in: header
        name: X-Nonce
        required: true
        type: string
      - description: Page View Request Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_events_v1.CreatePageViewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ent.PageView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_events_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_events_v1.ErrorResponse'
      summary: Create page view
      tags:
      - Events
  /api/v1/sites:
    get:
      description: Get a list of all sites
      parameters:
      - description: Filter by Tenant ID
        format: int64
        in: query
        name: tenant_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.ListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
      security:
      - BasicAuth: []
      summary: List all sites
      tags:
      - sites
    post:
      consumes:
      - application/json
      description: Create a new site with auto-generated security keys and assigned
        tenant ID
      parameters:
      - description: Site creation request
        in: body
        name: site
        required: true
        schema:
          $ref: '#/definitions/v1.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
        "409":
          description: Domain already exists
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Create a new site
      tags:
      - sites
  /api/v1/sites/{uuid}:
    delete:
      description: Permanently delete a site
      parameters:
      - description: Site UUID
        in: path
        name: uuid
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Delete a site
      tags:
      - sites
    get:
      description: Get detailed information about a specific site
      parameters:
      - description: Site UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Get a site by UUID
      tags:
      - sites
    patch:
      consumes:
      - application/json
      description: Update site information
      parameters:
      - description: Site UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Site update request
        in: body
        name: site
        required: true
        schema:
