basePath: /
definitions:
  internal_modules_sites_v1.ErrorResponse:
    properties:
      details:
        type: string
      error:
        type: string
    type: object
  internal_modules_visitors_v1.ErrorResponse:
    properties:
      details:
        type: string
      error:
        type: string
      status:
        type: integer
      success:
        type: boolean
      trace_id:
        type: string
      version:
        type: string
    type: object
  v1.CreateEventRequest:
    properties:
      city:
        type: string
      country:
        description: Geolocation fields if provided
        type: string
      event_name:
        type: string
      event_properties:
        additionalProperties: true
        type: object
      fingerprint_hash:
        type: string
      region:
        type: string
      session_token:
        type: string
      timezone:
        type: string
    required:
    - event_name
    - fingerprint_hash
    - session_token
    type: object
  v1.CreatePageViewRequest:
    properties:
      city:
        type: string
      country:
        description: Geolocation fields if provided
        type: string
      fingerprint_hash:
        type: string
      referrer:
        type: string
      region:
        type: string
      session_token:
        type: string
      timezone:
        type: string
      title:
        type: string
      url:
        type: string
    required:
    - fingerprint_hash
    - session_token
    - url
    type: object
  v1.CreateRequest:
    properties:
      domain:
        description: Domain of the site (required, must be unique and valid)
        type: string
      name:
        description: Name of the site (required, 1-255 characters)
        type: string
      tenant_id:
        description: Tenant ID of the site
        type: integer
    required:
    - domain
    - name
    - tenant_id
    type: object
  v1.CreateSessionRequest:
    properties:
      acquisition_campaign:
        type: string
      acquisition_medium:
        type: string
      acquisition_source:
        type: string
      address_ip:
        description: Geo location information extracted from ip
        type: string
      anonymous_id:
        type: string
      browser:
        type: string
      city:
        type: string
      country:
        type: string
      device_type:
        type: string
      entry_page:
        type: string
      exit_page:
        type: string
      fingerprint_hash:
        description: Device Info Extracted by the tracking SDK
        type: string
      language:
        type: string
      os:
        type: string
      referrer_host:
        type: string
      region:
        type: string
      session_token:
        description: Session Info
        type: string
      timezone:
        type: string
    required:
    - fingerprint_hash
    type: object
  v1.EventResponse:
    properties:
      created_at:
        type: string
      device_uuid:
        type: string
      event_name:
        type: string
      event_properties:
        additionalProperties: true
        type: object
      session_uuid:
        type: string
      uuid:
        type: string
      visitor_uuid:
        type: string
    type: object
  v1.ListResponse:
    properties:
      sites:
        items:
          $ref: '#/definitions/v1.Response'
        type: array
      total:
        type: integer
    type: object
  v1.PageViewResponse:
    properties:
      created_at:
        type: string
      device_uuid:
        type: string
      referrer:
        type: string
      session_uuid:
        type: string
      title:
        type: string
      url:
        type: string
      uuid:
        type: string
      visitor_uuid:
        type: string
    type: object
  v1.Response:
    properties:
      created_at:
        type: string
      domain:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      public_key:
        type: string
      tenant_id:
        type: integer
      updated_at:
        type: string
      uuid:
        type: string
    type: object
  v1.UpdateRequest:
    properties:
      domain:
        description: Optional new domain for the site
        type: string
      is_active:
        description: Optional active status
        type: boolean
      name:
        description: Optional new name for the site
        type: string
      tenant_id:
        description: Optional new tenant ID
        type: integer
    type: object
  v1.VisitorResponse:
    properties:
      anonymous_id:
        type: string
      first_seen_at:
        type: string
      is_bot:
        type: boolean
      is_verified_human:
        type: boolean
      last_seen_at:
        type: string
      primary_user_id:
        type: string
      uuid:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a tracking service API.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Tracking API
  version: "1.0"
paths:
  /api/v1/sites:
    get:
      description: Get a list of all sites
      parameters:
      - description: Filter by Tenant ID
        format: int64
        in: query
        name: tenant_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.ListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
      security:
      - BasicAuth: []
      summary: List all sites
      tags:
      - sites
    post:
      consumes:
      - application/json
      description: Create a new site with auto-generated security keys and assigned
        tenant ID
      parameters:
      - description: Site creation request
        in: body
        name: site
        required: true
        schema:
          $ref: '#/definitions/v1.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
        "409":
          description: Domain already exists
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Create a new site
      tags:
      - sites
  /api/v1/sites/{uuid}:
    delete:
      description: Permanently delete a site
      parameters:
      - description: Site UUID
        in: path
        name: uuid
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Delete a site
      tags:
      - sites
    get:
      description: Get detailed information about a specific site
      parameters:
      - description: Site UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Get a site by UUID
      tags:
      - sites
    patch:
      consumes:
      - application/json
      description: Update site information
      parameters:
      - description: Site UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Site update request
        in: body
        name: site
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
        "409":
          description: Domain already in use
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Update a site
      tags:
      - sites
  /api/v1/sites/{uuid}/regenerate-keys:
    post:
      description: Generate new public and secret keys for a site
      parameters:
      - description: Site UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_sites_v1.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Regenerate site security keys
      tags:
      - sites
  /api/v1/visitors:
    post:
      consumes:
      - application/json
      description: Create a visitor on a site. Creates a new visitor if not exists,
        or updates last seen time. Requires anonymous_id cookie.
      parameters:
      - description: Track visitor request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.CreateSessionRequest'
      - description: Public API Key
        in: header
        name: X-API-Key
        required: true
        type: string
      - description: HMAC Signature
        in: header
        name: X-Signature
        required: true
        type: string
      - description: Cookie must contain anonymous_id
        in: header
        name: Cookie
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.VisitorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_visitors_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_visitors_v1.ErrorResponse'
      summary: Create a visitor
      tags:
      - visitors
  /api/v1/visitors/events:
    post:
      consumes:
      - application/json
      description: Create a new visitor event linked to a valid session.
      parameters:
      - description: Create event request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.CreateEventRequest'
      - description: Public API Key
        in: header
        name: X-API-Key
        required: true
        type: string
      - description: HMAC Signature
        in: header
        name: X-Signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.EventResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_visitors_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_visitors_v1.ErrorResponse'
      summary: Create a visitor event
      tags:
      - visitors
  /api/v1/visitors/pageviews:
    post:
      consumes:
      - application/json
      description: Create a new page view linked to a valid session.
      parameters:
      - description: Create page view request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.CreatePageViewRequest'
      - description: Public API Key
        in: header
        name: X-API-Key
        required: true
        type: string
      - description: HMAC Signature
        in: header
        name: X-Signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.PageViewResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_modules_visitors_v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_modules_visitors_v1.ErrorResponse'
      summary: Create a page view
      tags:
      - visitors
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"
